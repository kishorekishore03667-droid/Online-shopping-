<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout | Kishore Kumar Mart</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <style>
    .checkout-layout {
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 2rem;
      margin: 2rem 0;
    }
    .checkout-card {
      background: white;
      border: 1px solid var(--gray-200);
      border-radius: var(--radius-lg);
      padding: 1.75rem;
      margin-bottom: 1.5rem;
    }
    .checkout-step-title {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--dark);
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 1.25rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--gray-100);
    }
    .step-num {
      background: var(--primary);
      color: white;
      width: 26px;
      height: 26px;
      border-radius: 9999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
    }
    .slot-options-grid, .payment-options-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
    }
    .choice-card {
      border: 1.5px solid var(--gray-200);
      border-radius: var(--radius-md);
      padding: 1rem;
      cursor: pointer;
      transition: var(--transition);
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
    }
    .choice-card:hover {
      border-color: var(--primary);
    }
    .choice-card input[type="radio"] {
      margin-top: 0.25rem;
      accent-color: var(--primary);
    }
    .choice-card.selected {
      border-color: var(--primary);
      background-color: var(--primary-light);
    }
    @media (max-width: 900px) {
      .checkout-layout { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header class="header">
    <div class="container navbar">
      <a href="index.html" class="logo-brand">
        <span>🛒 Kishore Kumar Mart</span>
        <span class="logo-badge">Checkout</span>
      </a>
      <div style="font-size: 0.85rem; color: #64748b; font-weight: 600;">
        🔒 256-Bit SSL Encrypted & Secure Checkout
      </div>
    </div>
  </header>

  <main class="container">
    <form id="checkout-form">
      <div class="checkout-layout">
        
        <!-- LEFT: MULTI-STEP CHECKOUT FORM -->
        <div>
          <!-- STEP 1: DELIVERY ADDRESS -->
          <div class="checkout-card">
            <div class="checkout-step-title">
              <span class="step-num">1</span>
              <span>Delivery Details & Contact</span>
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem;">
              <div class="form-group">
                <label class="form-label">Full Recipient Name</label>
                <input type="text" id="checkout-name" class="form-control" placeholder="Recipient's Name" required>
              </div>
              <div class="form-group">
                <label class="form-label">Mobile Phone Number</label>
                <input type="tel" id="checkout-phone" class="form-control" placeholder="+91 98765 43210" required>
              </div>
            </div>
            <div class="form-group">
              <label class="form-label">Full Street Address & Landmark</label>
              <textarea id="checkout-address" class="form-control" rows="2" placeholder="House/Flat No., Apartment, Street, Locality, Pincode" required></textarea>
            </div>
            <div class="form-group">
              <label class="form-label">Delivery Instructions (Optional)</label>
              <input type="text" id="checkout-notes" class="form-control" placeholder="e.g. Leave with security, call upon arrival">
            </div>
          </div>

          <!-- STEP 2: DELIVERY TIME SLOT -->
          <div class="checkout-card">
            <div class="checkout-step-title">
              <span class="step-num">2</span>
              <span>Preferred Delivery Slot</span>
            </div>
            <div class="slot-options-grid">
              <label class="choice-card">
                <input type="radio" name="delivery-slot" value="Morning (7:00 AM - 10:00 AM)" checked>
                <div>
                  <div style="font-weight: 700; font-size: 0.9rem;">🌅 Morning Slot</div>
                  <div style="font-size: 0.78rem; color: #64748b;">7:00 AM - 10:00 AM</div>
                </div>
              </label>

              <label class="choice-card">
                <input type="radio" name="delivery-slot" value="Afternoon (1:00 PM - 4:00 PM)">
                <div>
                  <div style="font-weight: 700; font-size: 0.9rem;">☀️ Afternoon Slot</div>
                  <div style="font-size: 0.78rem; color: #64748b;">1:00 PM - 4:00 PM</div>
                </div>
              </label>

              <label class="choice-card">
                <input type="radio" name="delivery-slot" value="Evening (5:00 PM - 8:00 PM)">
                <div>
                  <div style="font-weight: 700; font-size: 0.9rem;">🌆 Evening Slot</div>
                  <div style="font-size: 0.78rem; color: #64748b;">5:00 PM - 8:00 PM</div>
                </div>
              </label>

              <label class="choice-card">
                <input type="radio" name="delivery-slot" value="Express (Within 60 Minutes)">
                <div>
                  <div style="font-weight: 700; font-size: 0.9rem;">⚡ Express 60-Min</div>
                  <div style="font-size: 0.78rem; color: #059669; font-weight: 600;">Lightning Fast</div>
                </div>
              </label>
            </div>
          </div>

          <!-- STEP 3: PAYMENT METHOD -->
          <div class="checkout-card">
            <div class="checkout-step-title">
              <span class="step-num">3</span>
              <span>Select Payment Method</span>
            </div>
            <div class="payment-options-grid">
              <label class="choice-card">
                <input type="radio" name="payment-method" value="cod" checked>
                <div>
                  <div style="font-weight: 700; font-size: 0.95rem;">💵 Cash on Delivery</div>
                  <div style="font-size: 0.78rem; color: #64748b;">Pay cash or UPI at your doorstep</div>
                </div>
              </label>

              <label class="choice-card">
                <input type="radio" name="payment-method" value="upi">
                <div>
                  <div style="font-weight: 700; font-size: 0.95rem;">📱 UPI / Instant QR</div>
                  <div style="font-size: 0.78rem; color: #64748b;">Google Pay, PhonePe, Paytm, BHIM</div>
                </div>
              </label>

              <label class="choice-card">
                <input type="radio" name="payment-method" value="card">
                <div>
                  <div style="font-weight: 700; font-size: 0.95rem;">💳 Debit / Credit Card</div>
                  <div style="font-size: 0.78rem; color: #64748b;">Visa, Mastercard, RuPay cards</div>
                </div>
              </label>
            </div>
          </div>
        </div>

        <!-- RIGHT: ORDER SUMMARY & TOTAL -->
        <div>
          <div class="checkout-card" style="position: sticky; top: 5rem;">
            <h3 style="font-size: 1.15rem; font-weight: 800; color: var(--dark); margin-bottom: 1rem; border-bottom: 1px solid var(--gray-100); padding-bottom: 0.5rem;">
              Order Summary
            </h3>

            <!-- ITEMS LIST -->
            <div id="checkout-items-list" style="max-height: 220px; overflow-y: auto; margin-bottom: 1rem; border-bottom: 1px solid var(--gray-100); padding-bottom: 0.5rem;">
              <!-- Rendered dynamically -->
            </div>

            <!-- COUPON CODE INPUT -->
            <div style="display: flex; gap: 0.5rem; margin-bottom: 1.25rem;">
              <input type="text" id="checkout-coupon-code" class="coupon-input" placeholder="Coupon Code (e.g. WELCOME10)">
              <button type="button" id="checkout-apply-coupon" class="coupon-btn">Apply</button>
            </div>

            <!-- BILL BREAKDOWN -->
            <div class="bill-row">
              <span>Subtotal</span>
              <span id="summary-subtotal">₹0.00</span>
            </div>
            <div class="bill-row" id="summary-discount-row" style="display: none; color: #059669; font-weight: 700;">
              <span>Discount</span>
              <span id="summary-discount">-₹0.00</span>
            </div>
            <div class="bill-row">
              <span>Delivery Fee</span>
              <span id="summary-delivery">₹0.00</span>
            </div>
            <div class="bill-row total">
              <span>Final Total</span>
              <span id="summary-total">₹0.00</span>
            </div>

            <button type="submit" id="place-order-btn" class="checkout-btn" style="margin-top: 1.25rem;">
              Place Order Now 🚀
            </button>
          </div>
        </div>

      </div>
    </form>
  </main>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/checkout.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
