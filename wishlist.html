<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Wishlist | Kishore Kumar Mart</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <!-- HEADER -->
  <header class="header">
    <div class="container navbar">
      <a href="index.html" class="logo-brand">
        <span>🛒 Kishore Kumar Mart</span>
        <span class="logo-badge">Wishlist</span>
      </a>

      <div class="nav-actions">
        <a href="index.html" class="nav-btn">🏪 Store Catalog</a>
        <button id="cart-nav-btn" class="nav-btn primary">
          <span>🛒</span> <span>Cart</span>
          <span id="cart-badge" class="badge-counter" style="display: none;">0</span>
        </button>
        <div class="user-menu-wrapper">
          <button id="user-nav-btn" class="nav-btn">👤 <span>Account</span></button>
          <div id="user-dropdown" class="user-dropdown">
            <a href="orders.html">📦 My Orders</a>
            <a href="wishlist.html">♥ My Wishlist</a>
            <a href="admin.html" id="admin-dropdown-link">⚙️ Admin Dashboard</a>
            <button onclick="Auth.logout()" style="color: #ef4444; border-top: 1px solid #f1f5f9;">🚪 Sign Out</button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <main class="container" style="margin-top: 2rem; margin-bottom: 3rem;">
    <div class="section-header">
      <div>
        <h1 style="font-size: 1.6rem; font-weight: 800; color: var(--dark);">Your Saved Favorites</h1>
        <p style="font-size: 0.85rem; color: #64748b;">Keep track of items you plan to buy in future orders.</p>
      </div>
    </div>

    <div class="product-grid" id="wishlist-grid">
      <!-- Rendered dynamically by wishlist.js -->
    </div>
  </main>

  <!-- CART SLIDEOUT DRAWER -->
  <div id="cart-drawer-backdrop" class="drawer-backdrop"></div>
  <aside id="cart-drawer" class="cart-drawer">
    <div class="drawer-header">
      <div class="drawer-title"><span>🛒 Your Shopping Cart</span></div>
      <button id="cart-drawer-close" class="drawer-close">&times;</button>
    </div>
    <div class="drawer-body" id="cart-items-container"></div>
    <div class="drawer-footer">
      <div class="bill-row total"><span>Total</span><span id="cart-total">₹0.00</span></div>
      <button id="cart-checkout-btn" class="checkout-btn">Proceed to Checkout →</button>
    </div>
  </aside>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/wishlist.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
